[project]
name = "ha-smart-notification-manager"
version = "0.1.0.dev1"
description = "Foundation for a German-first Home Assistant Smart Notification Manager"
requires-python = ">=3.14.2"
dependencies = [
  "homeassistant>=2026.10.4,<2026.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "home-assistant-frontend==20261028.6",
  "pytest-homeassistant==2026.11.2",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"

[tool.ruff]
line-length = 120
target-version = "py313"
