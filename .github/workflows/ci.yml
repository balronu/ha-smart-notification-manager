name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          # Use the maintained 3.14 channel; hosted runners may not publish
          # every individual patch version.
          python-version: "3.14"
      - run: uv sync --extra test
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python -m compileall custom_components
      - name: independent Playwright fixture E2E
        run: |
          npm ci --ignore-scripts
          npx --yes playwright@1.65.1 install --with-deps webkit
          npm run e2e:phase12
          npm run e2e:editor
          npm run e2e:panel-lifecycle
          npm run e2e:mobile-navigation
      - run: uv run python -m json.tool custom_components/smart_notification_manager/manifest.json >/dev/null
      - run: uv run python -m json.tool custom_components/smart_notification_manager/strings.json >/dev/null
      - run: uv run python -m json.tool hacs.json >/dev/null
      - name: secret scan
        run: |
          uvx --from detect-secrets detect-secrets scan --all-files --force-use-all-plugins --exclude-files '(^|/)(\.git|\.venv|__pycache__|\.pytest_cache|\.ruff_cache|node_modules|artifacts/.*\.(png|trace\.zip)$)' > /tmp/smart-notification-manager-secret-scan.json
          uv run python -c 'import json; data=json.load(open("/tmp/smart-notification-manager-secret-scan.json")); raise SystemExit("Secret-Scan hat Treffer" if data["results"] else 0)'
      - name: secret scanner sentinel test
        shell: bash
        run: |
          set -euo pipefail
          sentinel_dir="$(mktemp -d)"
          trap 'rm -rf "$sentinel_dir"' EXIT
          sentinel_value="Jf83kLm92Qx71VrP"
          sentinel_value="${sentinel_value}60ZaN44Bw28Hs17"
          uvx --from detect-secrets detect-secrets scan --force-use-all-plugins --string "password=\"$sentinel_value\"" > /tmp/smart-notification-manager-sentinel.txt
          grep -Eq 'KeywordDetector[[:space:]]*:[[:space:]]*True|Base64HighEntropyString[[:space:]]*:[[:space:]]*True' /tmp/smart-notification-manager-sentinel.txt
      - run: node --check frontend/smart-notification-manager.js
      - run: cmp --silent frontend/smart-notification-manager.js custom_components/smart_notification_manager/frontend/smart-notification-manager.js
      - run: node --check frontend/phase-9-automation-migration.js
      - run: cmp --silent frontend/phase-9-automation-migration.js custom_components/smart_notification_manager/frontend/phase-9-automation-migration.js
      - run: node --check frontend/smart-notification-manager-observation-card.js
      - run: cmp --silent frontend/smart-notification-manager-observation-card.js custom_components/smart_notification_manager/frontend/smart-notification-manager-observation-card.js
      - run: node --check frontend/phase-11-guided-migration.js
      - run: cmp --silent frontend/phase-11-guided-migration.js custom_components/smart_notification_manager/frontend/phase-11-guided-migration.js

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: hacs
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
