<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regelvalidierung</title></head>
  <body>
    <smart-notification-rule-editor></smart-notification-rule-editor>
    <script src="smart-notification-manager.js"></script>
    <script>
      const editor = document.querySelector("smart-notification-rule-editor");
      editor.data = {
        entities: [{ entity_id: "binary_sensor.haustur_door_sensor", friendly_name: "Door sensor", area_id: "eingang", area_name: "Eingang", state: "off" }],
        rules: [],
        onSave: (rule) => { document.body.dataset.saved = "passed"; document.body.dataset.conditions = String(rule.conditions.children.length); }
      };
      editor.open();
    </script>
  </body>
</html>
