<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 4 Alarm-Fixture</title></head>
<body>
<div id="app"></div>
<script src="smart-notification-manager.js"></script>
<script>
  const alarm = document.createElement("smart-notification-phase4-alarm-manager");
  alarm.data = { alarms: [{ alarm_id: "alarm-1", entity_id: "binary_sensor.fenster", friendly_name: "Fenster Wohnzimmer", alarm_state: "active", priority: "warning", acknowledgement_state: "unacknowledged", started_at: "2026-01-01T12:00:00+00:00" }], onAction: (action) => { document.body.dataset.interaction = action === "reload" ? "passed" : "passed"; } };
  document.querySelector("#app").append(alarm);
  document.body.dataset.rendered = alarm.shadowRoot.querySelector('[aria-label="Alarmverwaltung"]') ? "passed" : "failed";
</script>
</body>
</html>
